name: Release

# Release Please creates the draft. Check and package the tagged commit, then
# attest its ZIPs, publish the draft, and deploy the website from the same tag.
# If a run fails before publishing, rerun the failed jobs or dispatch it with
# the draft's tag to finish it.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing draft release to finish (for example, v0.1.0)
        type: string
        required: true

concurrency:
  group: prism-release
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Release please
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs['apps/plugin--release_created'] || steps.draft.outputs.created }}
      tag: ${{ steps.release.outputs['apps/plugin--tag_name'] || steps.draft.outputs.tag }}
    steps:
      - id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - id: draft
        name: Find the draft release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a release tag such as v0.1.0.'; exit 1; }
          [[ $(gh release view "$TAG" --json isDraft --jq .isDraft) == true ]] || { echo "No draft release for $TAG."; exit 1; }
          echo 'created=true' >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  check:
    name: Check
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release-please.outputs.tag }}
      - uses: ./.github/actions/setup
        with:
          cache: false
      - name: Verify tag matches the plugin version
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
        run: test "$TAG" = "v$(node -p 'require("./apps/plugin/package.json").version')"
      # The website's build screenshots the web demo in Chromium.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter prism-website exec playwright install --with-deps chromium
      - run: pnpm check

  build:
    name: Build (${{ matrix.platform }})
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, os: ubuntu-24.04 }
          - { platform: windows-x64, os: windows-2025 }
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release-please.outputs.tag }}
      - uses: ./.github/actions/setup
        with:
          cache: false
      - id: vst3
        uses: ./.github/actions/vst3
        with:
          platform: ${{ matrix.platform }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vst3-${{ matrix.platform }}
          path: ${{ steps.vst3.outputs.zip }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [release-please, check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vst3-*
          merge-multiple: true
          path: ${{ runner.temp }}/release
      - name: Checksums
        working-directory: ${{ runner.temp }}/release
        run: |
          version=${TAG#v}
          sha256sum "Soundor-Prism-$version-"{linux-x86_64,windows-x64}.zip > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: ${{ runner.temp }}/release/SHA256SUMS
      - name: Upload to the draft release
        working-directory: ${{ runner.temp }}/release
        run: gh release upload "$TAG" "Soundor-Prism-${TAG#v}-"{linux-x86_64,windows-x64}.zip SHA256SUMS --clobber
      - name: Publish the release
        run: gh release edit "$TAG" --draft=false --latest

  website:
    name: Website
    needs: [release-please, publish]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/website.yml
    with:
      cache: false
      ref: refs/tags/${{ needs.release-please.outputs.tag }}
