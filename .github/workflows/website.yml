name: Website
on:
  workflow_dispatch:
    inputs:
      cache:
        description: Whether to cache the pnpm store
        type: boolean
        default: true
      ref:
        description: Branch, tag, or commit to deploy
        type: string
        default: main
  workflow_call:
    inputs:
      cache:
        description: Whether to cache the pnpm store
        type: boolean
        default: true
      ref:
        description: Published release tag to deploy
        type: string
        required: true

permissions: {}

concurrency:
  group: prism-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup
        with:
          cache: ${{ inputs.cache }}
      - name: Verify the download assets are published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node apps/website/scripts/check-release.ts
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        id: site
      - run: pnpm build
        env:
          PRISM_SITE_BASE: ${{ steps.site.outputs.base_path }}/
          VITE_PRISM_SITE_ORIGIN: ${{ steps.site.outputs.origin }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/website/dist/client
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
